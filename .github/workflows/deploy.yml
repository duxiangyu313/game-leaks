name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: npm ci

      - name: Build cache
        run: node scripts/build-cache.js

      - name: Build
        run: npx next build

      - name: Fix RSC + Sitemap
        run: node scripts/fix-rsc.js live && node scripts/generate-sitemap.js live && node -e "require('fs').writeFileSync('live/.nojekyll','')"

      - name: Submit to search engines (IndexNow + Baidu)
        run: node scripts/submit-indexnow.js live
        env:
          BAIDU_ZZ_TOKEN: ${{ secrets.BAIDU_ZZ_TOKEN }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./live
          cname: news.guoyouwenduji.cc
